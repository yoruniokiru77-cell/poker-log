<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>♠ ポーカー収支管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0f0f14;--surface:#1a1a24;--surface2:#22222e;--border:#2e2e3e;
    --text:#f0f0f8;--muted:#7a7a9a;--dim:#3a3a50;
    --indigo:#6366f1;--indigo-dim:#6366f120;--indigo-hover:#7577f3;
    --green:#22c55e;--green-dim:#22c55e18;
    --red:#ef4444;--red-dim:#ef444418;
    --amber:#f59e0b;--amber-dim:#f59e0b18;
    --cyan:#06b6d4;
  }
  body{font-family:'Noto Sans JP','Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh}
  #root{max-width:430px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative}
  .page{padding:0 16px 100px}
  .hdr{padding:14px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:100;display:flex;align-items:center;gap:10px;backdrop-filter:blur(8px)}
  .hdr-title{font-size:16px;font-weight:600;flex:1;font-family:'Outfit',sans-serif;letter-spacing:.02em}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px}
  .card-sm{padding:12px}
  .btn{width:100%;padding:14px;border-radius:10px;border:none;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;letter-spacing:.01em}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .btn-primary{background:var(--indigo);color:#fff}
  .btn-primary:hover:not(:disabled){background:var(--indigo-hover)}
  .btn-success{background:var(--green);color:#000}
  .btn-danger{background:var(--red);color:#fff}
  .btn-amber{background:var(--amber);color:#000}
  .btn-outline{background:transparent;border:1.5px solid var(--indigo);color:var(--indigo)}
  .btn-ghost{background:var(--surface2);color:var(--muted);border:none}
  .btn-sm{padding:8px 14px;font-size:13px;border-radius:8px;width:auto}
  .inp{width:100%;padding:13px 14px;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;font-size:16px;color:var(--text);outline:none;transition:border-color .2s;font-family:inherit}
  .inp:focus{border-color:var(--indigo)}
  .inp::placeholder{color:var(--dim)}
  .lbl{font-size:12px;color:var(--muted);margin-bottom:6px;display:block;font-weight:500;letter-spacing:.04em}
  .fld{margin-bottom:14px}
  .sec-lbl{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin:20px 0 8px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
  .row:last-child{border:none}
  .row-lbl{font-size:13px;color:var(--muted)}
  .row-val{font-size:13px;font-weight:600}
  .bdg{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
  .bdg-pending{background:var(--amber-dim);color:var(--amber)}
  .bdg-active{background:var(--green-dim);color:var(--green)}
  .bdg-admin{background:var(--indigo-dim);color:var(--indigo)}
  .bdg-gray{background:var(--surface2);color:var(--muted)}
  .plus{color:var(--green);font-weight:700}
  .minus{color:var(--red);font-weight:700}
  .spin{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--indigo);border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);color:var(--text);padding:12px 20px;border-radius:12px;font-size:14px;z-index:999;max-width:340px;text-align:center;box-shadow:0 8px 32px #0008}
  .center{display:flex;justify-content:center;align-items:center;min-height:200px;flex-direction:column;gap:12px;color:var(--muted)}
  .tabs{display:flex;border-bottom:1px solid var(--border);margin:0 -16px;padding:0 16px}
  .tab{flex:1;padding:10px 4px;text-align:center;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
  .tab.on{color:var(--indigo);border-bottom-color:var(--indigo)}
  .overlay{position:fixed;inset:0;background:#0009;z-index:200;display:flex;align-items:flex-end}
  .sheet{background:var(--surface);border-radius:20px 20px 0 0;padding:24px 16px 40px;width:100%;max-height:85dvh;overflow-y:auto}
  .sheet-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px}
  .warn{background:var(--amber-dim);border-radius:10px;padding:11px 13px;font-size:13px;color:var(--amber);margin-bottom:10px;line-height:1.5}
  .info{background:var(--indigo-dim);border-radius:10px;padding:11px 13px;font-size:13px;color:var(--indigo);margin-bottom:10px;line-height:1.5}
  .ok{background:var(--green-dim);border-radius:10px;padding:11px 13px;font-size:13px;color:var(--green);margin-bottom:10px;line-height:1.5}
  .err{background:var(--red-dim);border-radius:10px;padding:11px 13px;font-size:13px;color:var(--red);margin-bottom:10px;line-height:1.5}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .stat{background:var(--surface2);border-radius:10px;padding:12px;text-align:center}
  .stat-v{font-size:22px;font-weight:700;font-family:'Outfit',sans-serif}
  .stat-l{font-size:11px;color:var(--muted);margin-top:2px}
  .url-box{background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:11px;color:var(--muted);word-break:break-all;font-family:monospace;margin-bottom:8px;border:1px solid var(--border)}
  .av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Outfit',sans-serif;flex-shrink:0}
  .pr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
  .pr:last-child{border:none}
  .pr-info{flex:1}
  .pr-name{font-size:15px;font-weight:600}
  .pr-sub{font-size:12px;color:var(--muted);margin-top:1px}
  .gap8{display:flex;gap:8px}
  .mt{margin-top:12px}
  .mb{margin-bottom:10px}
  .back-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;display:flex;align-items:center;border-radius:6px}
  .back-btn:hover{color:var(--text)}
  select{width:100%;padding:13px 14px;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;font-size:16px;color:var(--text);outline:none;font-family:inherit;-webkit-appearance:none}
  select:focus{border-color:var(--indigo)}
  .divider{height:1px;background:var(--border);margin:12px 0}
  .chip-pill{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
  .session-bar{padding:8px 16px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;gap:16px;font-size:12px;color:var(--muted)}
  .session-bar strong{color:var(--text)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ============================================================
//  CONFIG  — Supabase の URL と anon key を貼り付けてください
// ============================================================
const SUPABASE_URL  = 'https://plggbqsrsaqappsgcojf.supabase.co';
const SUPABASE_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsZ2dicXNyc2FxYXBwc2djb2pmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyOTcwNTIsImV4cCI6MjA5NDg3MzA1Mn0.SiQBhz5_60jrmCBWKWKQ1YN15L1ooqe7PZSYagk3eAo';
// ============================================================

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ─── ユーティリティ ─────────────────────────────────────────

const fy = (n) => {
  if (n === null || n === undefined) return null;
  const s = n > 0 ? '+' : '';
  return s + '¥' + Math.abs(n).toLocaleString();
};
const fc = (n) => (n >= 0 ? '+' : '') + n.toLocaleString() + '枚';
const initial = (name) => (name||'?').charAt(0).toUpperCase();

const COLORS = ['#6366f1','#06b6d4','#22c55e','#f59e0b','#ef4444','#a855f7','#ec4899'];
const avColor = (name) => {
  let h = 0;
  for (const c of (name||'')) h = h*31 + c.charCodeAt(0);
  return COLORS[Math.abs(h) % COLORS.length];
};

function calcStats(sp, txs, rate) {
  const mine = txs.filter(t => t.session_player_id === sp.id && t.status === 'approved');
  const buyIn    = mine.filter(t=>t.type==='buy_in').reduce((s,t)=>s+t.chips,0);
  const borrowed = mine.filter(t=>t.type==='borrow').reduce((s,t)=>s+t.chips,0);
  const repaid   = mine.filter(t=>t.type==='repay').reduce((s,t)=>s+t.chips,0);
  const netBorrow = borrowed - repaid;
  const final = sp.final_chip_count ?? null;
  const profitChips = final !== null ? final - buyIn - netBorrow : null;
  const profitYen   = profitChips !== null ? profitChips * rate : null;
  const carryOver   = sp.carry_over_balance ?? 0;
  const total       = profitYen !== null ? profitYen + carryOver : null;
  return { buyIn, borrowed, repaid, netBorrow, profitChips, profitYen, carryOver, total };
}

function zeroCheck(sps, txs) {
  const ok_txs = txs.filter(t=>t.status==='approved');
  const out  = ok_txs.filter(t=>['buy_in','borrow'].includes(t.type)).reduce((s,t)=>s+t.chips,0);
  const back = ok_txs.filter(t=>t.type==='repay').reduce((s,t)=>s+t.chips,0);
  const net  = out - back;
  const active = sps.filter(sp=>sp.status==='active');
  const all  = active.every(sp=>sp.final_chip_count !== null && sp.final_chip_count !== undefined);
  const sum  = active.reduce((s,sp)=>s+(sp.final_chip_count??0),0);
  return { net, sum, ok: all && net===sum, all, diff: sum-net, count: active.length };
}

function minimize(players) {
  const bal = players.map(p=>({id:p.id,name:p.display_name,b:p._total}));
  const out = [];
  for (let i=0; i<200; i++) {
    const d = bal.reduce((m,p)=>p.b<m.b?p:m,{b:0});
    const c = bal.reduce((m,p)=>p.b>m.b?p:m,{b:0});
    if (d.b > -0.5 || c.b < 0.5) break;
    const amt = Math.min(Math.abs(d.b), c.b);
    out.push({from:d.name,to:c.name,fromId:d.id,toId:c.id,amount:Math.round(amt)});
    d.b += amt; c.b -= amt;
  }
  return out;
}

// ─── 小コンポーネント ────────────────────────────────────────

const Spin = ({size=22}) => <div className="spin" style={{width:size,height:size}}/>;
const Loading = () => <div className="center"><Spin size={32}/><span style={{color:'var(--muted)',fontSize:14}}>読み込み中...</span></div>;

const Toast = ({msg,type}) => {
  if (!msg) return null;
  const col = type==='err'?'var(--red)':type==='ok'?'var(--green)':'var(--text)';
  return <div className="toast" style={{borderColor:col,color:col}}>{msg}</div>;
};

const Btn = ({children,onClick,v='primary',sm,loading,disabled,style,full=true}) => (
  <button className={`btn btn-${v}${sm?' btn-sm':''}`} onClick={onClick}
    disabled={disabled||loading} style={{width:full?undefined:'auto',...style}}>
    {loading?<Spin size={18}/>:children}
  </button>
);

const Inp = ({lbl,value,onChange,type='text',ph,min,max,step,inputMode}) => (
  <div className="fld">
    {lbl && <label className="lbl">{lbl}</label>}
    <input className="inp" type={type} value={value} placeholder={ph}
      onChange={e=>onChange(e.target.value)} min={min} max={max} step={step}
      inputMode={inputMode||type==='number'?'numeric':undefined}/>
  </div>
);

const Av = ({name,size=36}) => (
  <div className="av" style={{width:size,height:size,background:avColor(name),fontSize:size*.38,color:'#fff'}}>
    {initial(name)}
  </div>
);

const Back = ({onClick}) => (
  <button className="back-btn" onClick={onClick}>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
      <path d="M19 12H5M5 12l7 7M5 12l7-7"/>
    </svg>
  </button>
);

const AmtTag = ({yen}) => {
  if (yen===null) return <span style={{color:'var(--muted)',fontSize:13}}>集計中</span>;
  return <span className={yen>=0?'plus':'minus'} style={{fontSize:20,fontFamily:'Outfit,sans-serif',fontWeight:700}}>{fy(yen)}</span>;
};

// ─── HOME ────────────────────────────────────────────────────

const Home = ({onCreate, onJoin, onUnsettled, onSessions, onStats}) => {
  const [code,setCode] = useState('');
  return (
    <div className="page" style={{paddingTop:48}}>
      <div style={{textAlign:'center',marginBottom:36}}>
        <div style={{fontSize:52,marginBottom:10}}>♠</div>
        <h1 style={{fontFamily:'Outfit,sans-serif',fontSize:26,fontWeight:700,letterSpacing:'-.02em',marginBottom:6}}>
          ポーカー収支管理
        </h1>
        <p style={{color:'var(--muted)',fontSize:14}}>チップの貸し借りと精算をミスなく管理</p>
      </div>

      <Btn v="primary" onClick={onCreate} style={{marginBottom:10}}>
        ＋ テーブルを作成する
      </Btn>

      <div className="card">
        <label className="lbl">セッションIDで参加</label>
        <div className="gap8">
          <input className="inp" style={{flex:1}} placeholder="セッションIDを入力..."
            value={code} onChange={e=>setCode(e.target.value.trim())}
            onKeyDown={e=>e.key==='Enter'&&code&&onJoin(code)}/>
          <Btn sm v="outline" full={false} onClick={()=>code&&onJoin(code)}>参加</Btn>
        </div>
      </div>

      <div style={{textAlign:'center',marginTop:16,display:'flex',flexDirection:'column',gap:10}}>
        <button onClick={onUnsettled}
          style={{background:'none',border:'none',color:'var(--indigo)',fontSize:14,cursor:'pointer',fontWeight:500}}>
          未精算一覧を見る →
        </button>
        <button onClick={onSessions}
          style={{background:'none',border:'none',color:'var(--muted)',fontSize:14,cursor:'pointer',fontWeight:500}}>
          セッション履歴を見る →
        </button>
        <button onClick={onStats}
          style={{background:'none',border:'none',color:'var(--muted)',fontSize:14,cursor:'pointer',fontWeight:500}}>
          総合成績・ランキングを見る →
        </button>
      </div>
    </div>
  );
};

// ─── STATS PAGE ───────────────────────────────────────────────

const StatsPage = ({onBack}) => {
  const [from,setFrom] = useState('');
  const [to,setTo]     = useState('');
  const [stats,setStats] = useState([]);
  const [sessCount,setSessCount] = useState(0);
  const [loading,setLoading] = useState(true);
  const [expanded,setExpanded] = useState(null);

  const load = async () => {
    setLoading(true);
    let q = db.from('sessions').select().eq('status','closed');
    if (from) q = q.gte('created_at', from+'T00:00:00');
    if (to)   q = q.lte('created_at', to+'T23:59:59');
    const {data:sessions} = await q.order('created_at',{ascending:false});
    if (!sessions?.length){ setStats([]); setSessCount(0); setLoading(false); return; }

    const ids = sessions.map(s=>s.id);
    const rateMap = {}; const nameMap = {};
    sessions.forEach(s=>{ rateMap[s.id]=s.chip_rate; nameMap[s.id]=s.name; });

    const [{data:sps},{data:txs}] = await Promise.all([
      db.from('session_players').select().in('session_id',ids),
      db.from('transactions').select().in('session_id',ids).eq('status','approved')
    ]);

    // player_id → 集計、なければ display_name で集計
    const map = {};
    (sps||[]).forEach(sp=>{
      if (sp.final_chip_count===null) return;
      const key = sp.player_id || ('name:'+sp.display_name);
      if (!map[key]) map[key] = {name:sp.display_name, totalYen:0, sessions:[], wins:0};

      const myTxs = (txs||[]).filter(t=>t.session_player_id===sp.id);
      const st = calcStats(sp, myTxs, rateMap[sp.session_id]);
      if (st.profitYen===null) return;

      map[key].totalYen += st.profitYen;
      if (st.profitYen > 0) map[key].wins++;
      map[key].sessions.push({
        sessionName: nameMap[sp.session_id],
        profitYen: st.profitYen,
        profitChips: st.profitChips,
        buyIn: st.buyIn, netBorrow: st.netBorrow,
        finalCount: sp.final_chip_count
      });
    });

    const sorted = Object.values(map).sort((a,b)=>b.totalYen-a.totalYen);
    setStats(sorted);
    setSessCount(sessions.length);
    setLoading(false);
  };

  useEffect(()=>{load();},[]);

  const medal = (i) => i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}位`;

  return (
    <>
      <div className="hdr"><Back onClick={onBack}/><span className="hdr-title">総合成績・ランキング</span></div>
      <div className="page" style={{paddingTop:16}}>

        {/* 期間フィルター */}
        <div className="card mb">
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <div style={{flex:1}}>
              <label className="lbl">開始日</label>
              <input className="inp" type="date" value={from} onChange={e=>setFrom(e.target.value)}/>
            </div>
            <div style={{color:'var(--muted)',paddingTop:18}}>〜</div>
            <div style={{flex:1}}>
              <label className="lbl">終了日</label>
              <input className="inp" type="date" value={to} onChange={e=>setTo(e.target.value)}/>
            </div>
          </div>
          <div style={{marginTop:10}}>
            <Btn sm v="primary" full={false} onClick={load}>集計する</Btn>
            {(from||to) && <Btn sm v="ghost" full={false} style={{marginLeft:8}} onClick={()=>{setFrom('');setTo('');setTimeout(load,0);}}>クリア</Btn>}
          </div>
        </div>

        {loading ? <Loading/> : stats.length===0 ? (
          <div style={{color:'var(--muted)',textAlign:'center',padding:'40px 0'}}>
            終了済みセッションがありません
          </div>
        ) : (
          <>
            <div className="info" style={{marginBottom:12}}>
              対象セッション数: <strong>{sessCount}回</strong>　参加プレイヤー数: <strong>{stats.length}名</strong>
            </div>

            {stats.map((p,i)=>{
              const winRate = p.sessions.length>0 ? Math.round(p.wins/p.sessions.length*100) : 0;
              const isOpen = expanded===i;
              return (
                <div key={i} className="card" style={{marginBottom:10,borderColor: i===0?'var(--amber)':i===1?'var(--muted)':i===2?'#cd7f32':'var(--border)'}}>
                  {/* ヘッダー行 */}
                  <div style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer'}} onClick={()=>setExpanded(isOpen?null:i)}>
                    <div style={{fontSize:22,width:32,textAlign:'center',flexShrink:0}}>{medal(i)}</div>
                    <Av name={p.name}/>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:700,fontSize:15}}>{p.name}</div>
                      <div style={{fontSize:12,color:'var(--muted)',marginTop:1}}>
                        {p.sessions.length}戦 {p.wins}勝 (勝率{winRate}%)
                      </div>
                    </div>
                    <div style={{textAlign:'right'}}>
                      <div style={{fontSize:22,fontWeight:700,fontFamily:'Outfit,sans-serif',color:p.totalYen>=0?'var(--green)':'var(--red)'}}>
                        {fy(p.totalYen)}
                      </div>
                      <div style={{fontSize:11,color:'var(--muted)'}}>通算</div>
                    </div>
                    <div style={{color:'var(--muted)',fontSize:12,marginLeft:4}}>{isOpen?'▲':'▼'}</div>
                  </div>

                  {/* 展開：セッション別内訳 */}
                  {isOpen && (
                    <div style={{marginTop:12,borderTop:'1px solid var(--border)',paddingTop:12}}>
                      <div style={{fontSize:11,color:'var(--muted)',fontWeight:700,letterSpacing:'.08em',marginBottom:8}}>セッション別内訳</div>
                      {p.sessions.map((r,j)=>(
                        <div key={j} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
                          <div style={{flex:1}}>
                            <div style={{fontSize:13}}>{r.sessionName}</div>
                            <div style={{fontSize:11,color:'var(--muted)'}}>
                              最終{r.finalCount}枚 / 使用{r.buyIn+r.netBorrow}枚
                            </div>
                          </div>
                          <div style={{textAlign:'right'}}>
                            <div style={{fontWeight:700,fontSize:14,color:r.profitYen>=0?'var(--green)':'var(--red)'}}>
                              {fy(r.profitYen)}
                            </div>

const JoinSession = ({session, onBack, onJoined}) => {
  const [name,setName] = useState('');
  const [sub,setSub] = useState(false);
  const [err,setErr] = useState('');
  const go = async () => {
    if (!name.trim()) return setErr('名前を入力してください');
    setSub(true); setErr('');
    try {
      // 同名プレイヤーが既存なら再利用、なければ新規作成
      let playerId;
      const {data:existing} = await db.from('players')
        .select().eq('display_name',name.trim()).maybeSingle();
      if (existing) {
        playerId = existing.id;
      } else {
        const {data:newPlayer} = await db.from('players')
          .insert({display_name:name.trim(),carry_over_balance:0}).select().single();
        playerId = newPlayer?.id;
      }

      // セッション参加（即座にactive）
      const {data,error} = await db.from('session_players').insert({
        session_id:session.id, display_name:name.trim(),
        status:'active', player_id:playerId, carry_over_balance:0
      }).select().single();
      if (error) throw error;

      // バイイン自動記録
      await db.from('transactions').insert({
        session_id:session.id, session_player_id:data.id,
        type:'buy_in', chips:session.buy_in_chips, status:'approved'
      });
      // 在庫更新
      await db.from('sessions').update({
        current_stock: session.current_stock - session.buy_in_chips
      }).eq('id',session.id);

      localStorage.setItem(`pk_sp_${session.id}`,data.id);
      onJoined(data.id, data.display_name);
    } catch(e) { setErr('参加失敗: '+e.message); }
    setSub(false);
  };

  return (
    <>
      <div className="hdr"><Back onClick={onBack}/><span className="hdr-title">{session.name}</span></div>
      <div className="page" style={{paddingTop:16}}>
        {['closed','settling','counting'].includes(session.status) ? (
          <div className="info" style={{marginTop:20,textAlign:'center'}}>
            このセッションはすでに終了しています
          </div>
        ) : (
          <>
            {err && <div className="err">{err}</div>}
            <div className="card" style={{background:'var(--indigo-dim)',border:'1px solid var(--indigo)',marginBottom:20}}>
              <div className="row"><span className="row-lbl">バイイン</span><span className="row-val">{session.buy_in_chips}枚</span></div>
              <div className="row"><span className="row-lbl">レート</span><span className="row-val">¥{session.chip_rate}/枚</span></div>
              <div className="row"><span className="row-lbl">バイイン金額</span>
                <span style={{fontWeight:700,color:'var(--indigo)',fontFamily:'Outfit,sans-serif',fontSize:16}}>
                  ¥{(session.buy_in_chips*session.chip_rate).toLocaleString()}</span>
              </div>
            </div>
            <Inp lbl="あなたの名前" value={name} onChange={setName} ph="表示名を入力..."/>
            <Btn v="primary" onClick={go} loading={sub}>参加申請する</Btn>
          </>
        )}
      </div>
    </>
  );
};

const PlayerView = ({session, mySpId, onEnd}) => {
  const [sp,setSp] = useState(null);

  const [loading,setLoading] = useState(true);
  const [sessionStatus,setSessionStatus] = useState(session.status);

  const load = async () => {
    const [{data:s},{data:t}] = await Promise.all([
      db.from('session_players').select().eq('id',mySpId).single(),
      db.from('transactions').select().eq('session_player_id',mySpId).order('created_at',{ascending:false})
    ]);
    if (s) setSp(s);
    if (t) setTxs(t);
    setLoading(false);
  };

  useEffect(()=>{load();},[]);

  useEffect(()=>{
    const ch = db.channel('pv_'+mySpId)
      .on('postgres_changes',{event:'*',schema:'public',table:'transactions',filter:`session_player_id=eq.${mySpId}`},load)
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'sessions',filter:`id=eq.${session.id}`},(p)=>{
        setSessionStatus(p.new.status);
        if (['settling','closed'].includes(p.new.status)) onEnd(p.new.status);
      }).subscribe();
    return ()=>db.removeChannel(ch);
  },[]);

  const send = async (type) => {
    if (!reqChips||+reqChips<=0) return;
    setSub(true);
    await db.from('transactions').insert({
      session_id:session.id, session_player_id:mySpId,
      type, chips:+reqChips, status:'pending', note:reqNote||null

    setShowBorrow(false); setShowRepay(false);
    setSub(false); load();
  };

  if (loading||!sp) return <Loading/>;
  const stats = calcStats(sp,txs,session.chip_rate);

  // ゲーム終了 → チップカウント中の待機画面

          <div className="row"><span className="row-lbl">使用合計</span><span className="row-val">{stats.buyIn+stats.netBorrow}枚</span></div>
        </div>
      </div>
    </>
  );

const AdminView = ({session:initSession, onCounting}) => {
  const [session,setSession] = useState(initSession);
  const [sps,setSps] = useState([]);
  const [txs,setTxs] = useState([]);
  const [players,setPlayers] = useState([]); // 未精算プレイヤー候補
  const [tab,setTab] = useState('players');
  const [loading,setLoading] = useState(true);
  const [linkModal,setLinkModal] = useState(null);
  const [cp,setCp] = useState(false);
  const [editModal,setEditModal] = useState(null); // {sp, newName, saving}

  const load = async () => {
    const [{data:s},{data:t}] = await Promise.all([
      db.from('session_players').select().eq('session_id',session.id).order('joined_at'),
      db.from('transactions').select().eq('session_id',session.id).order('created_at',{ascending:false})
    ]);
    if(s)setSps(s); if(t)setTxs(t); setLoading(false);
  };

  const loadPlayers = async () => {
    const {data} = await db.from('players').select().neq('carry_over_balance',0).order('display_name');
    setPlayers(data||[]);
  };

  useEffect(()=>{load();loadPlayers();},[]);

  useEffect(()=>{
    const ch = db.channel('adm_'+session.id)
      .on('postgres_changes',{event:'*',schema:'public',table:'session_players',filter:`session_id=eq.${session.id}`},load)
      .on('postgres_changes',{event:'*',schema:'public',table:'transactions',filter:`session_id=eq.${session.id}`},load)
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'sessions',filter:`id=eq.${session.id}`},(p)=>setSession(p.new))
      .subscribe();
    return ()=>db.removeChannel(ch);
  },[]);

  const approveJoin = async (sp, existingPlayerId=null) => {
    let carryOver=0, playerId=existingPlayerId;
    if (existingPlayerId) {
      const p = players.find(x=>x.id===existingPlayerId);
      carryOver = p?.carry_over_balance||0;
    } else {
      const {data:np} = await db.from('players').insert({display_name:sp.display_name,carry_over_balance:0}).select().single();
      playerId = np?.id;
    }
    await db.from('session_players').update({status:'active',player_id:playerId,carry_over_balance:carryOver}).eq('id',sp.id);
    await db.from('transactions').insert({session_id:session.id,session_player_id:sp.id,type:'buy_in',chips:session.buy_in_chips,status:'approved'});
    const newStock = session.current_stock - session.buy_in_chips;
    await db.from('sessions').update({current_stock:newStock}).eq('id',session.id);
    setSession(s=>({...s,current_stock:newStock}));
    setLinkModal(null); load();
  };

  const onApprove = (sp) => {
    if (players.length>0) setLinkModal(sp);
    else approveJoin(sp,null);
  };

  const approveTx = async (tx) => {
    const delta = tx.type==='borrow' ? -tx.chips : tx.chips;
    await db.from('transactions').update({status:'approved'}).eq('id',tx.id);
    const newStock = session.current_stock + delta;
    await db.from('sessions').update({current_stock:newStock}).eq('id',session.id);
    setSession(s=>({...s,current_stock:newStock}));
    load();
  };

  const rejectTx = async (tx) => {
    await db.from('transactions').update({status:'rejected'}).eq('id',tx.id);
    load();
  };

  const renamePlayer = async () => {
    const {sp, newName} = editModal;
    if (!newName.trim() || newName.trim()===sp.display_name) { setEditModal(null); return; }
    setEditModal(e=>({...e,saving:true}));
    const name = newName.trim();

    // 同名プレイヤーが既存か確認
    const {data:existing} = await db.from('players').select().eq('display_name',name).maybeSingle();

    if (existing && existing.id !== sp.player_id) {
      // 既存プレイヤーに統合
      await db.from('session_players').update({
        display_name: name,
        player_id: existing.id,
        carry_over_balance: existing.carry_over_balance
      }).eq('id', sp.id);
    } else {
      // 名前だけ変更
      await db.from('session_players').update({display_name: name}).eq('id', sp.id);
      if (sp.player_id) {
        await db.from('players').update({display_name: name}).eq('id', sp.player_id);
      }
    }
    setEditModal(null);
    load();
  };

  const startCounting = async () => {
    await db.from('sessions').update({status:'counting'}).eq('id',session.id);
    onCounting();
  };

  const copyUrl = () => {
    const url = `${window.location.origin}${window.location.pathname}?s=${session.id}`;
    navigator.clipboard.writeText(url).then(()=>{setCp(true);setTimeout(()=>setCp(false),2000)});
  };

  if(loading) return <Loading/>;

  const pending = sps.filter(sp=>sp.status==='pending');
  const active  = sps.filter(sp=>sp.status==='active');

// ─── COUNTING ────────────────────────────────────────────────

const Counting = ({session, onComplete}) => {
  const [sps,setSps] = useState([]);
  const [txs,setTxs] = useState([]);
  const [counts,setCounts] = useState({});
  const [loading,setLoading] = useState(true);
  const [saving,setSaving] = useState(false);

  useEffect(()=>{
    Promise.all([
      db.from('session_players').select().eq('session_id',session.id).eq('status','active').order('joined_at'),
      db.from('transactions').select().eq('session_id',session.id).order('created_at')
    ]).then(([{data:s},{data:t}])=>{
      if(s){ setSps(s); const init={}; s.forEach(sp=>{if(sp.final_chip_count!==null)init[sp.id]=String(sp.final_chip_count);}); setCounts(init); }
      if(t) setTxs(t);
      setLoading(false);
    });
  },[]);

  const cur = sps.map(sp=>({...sp,final_chip_count:counts[sp.id]!==undefined&&counts[sp.id]!==''?+counts[sp.id]:sp.final_chip_count}));
  const zc = zeroCheck(cur, txs);

  const saveCount = async (spId) => {
    const v = counts[spId];
    if (v===''||v===undefined) return;
    await db.from('session_players').update({final_chip_count:+v}).eq('id',spId);
  };

  const finalize = async () => {
    if (!zc.ok) return;
    setSaving(true);
    await Promise.all(sps.map(sp=>db.from('session_players').update({final_chip_count:+counts[sp.id]}).eq('id',sp.id)));
    await db.from('sessions').update({status:'settling'}).eq('id',session.id);
    setSaving(false);
    onComplete();
  };

  if(loading) return <Loading/>;

  return (
    <>
      <div className="hdr"><span className="hdr-title">チップカウント</span><span className="bdg bdg-admin">管理者</span></div>
      <div className="page" style={{paddingTop:16}}>
        <div className={zc.ok?'ok':zc.all?'err':'warn'} style={{marginBottom:16}}>
          {zc.ok
            ? `✓ ±0 チェック OK — 精算へ進めます（合計: ${zc.net}枚）`
            : zc.all
              ? `❌ 差分 ${zc.diff>0?'+':''}${zc.diff}枚　配出: ${zc.net}枚 / 回収: ${zc.sum}枚`
              : `配出合計: ${zc.net}枚　全員の枚数を入力してください`
          }
        </div>

        {sps.map(sp=>{
          const st = calcStats(sp,txs,session.chip_rate);
          return (
            <div key={sp.id} className="card mb" style={{marginBottom:10}}>
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
                <Av name={sp.display_name}/>
                <div style={{flex:1}}>
                  <div style={{fontWeight:600}}>{sp.display_name}</div>
                  <div style={{fontSize:12,color:'var(--muted)'}}>使用枚数: {st.buyIn+st.netBorrow}枚</div>
                </div>
              </div>
              <label className="lbl">手持ち枚数</label>
              <input className="inp" type="number" inputMode="numeric" placeholder="0" min="0"
                value={counts[sp.id]??''} onChange={e=>setCounts(c=>({...c,[sp.id]:e.target.value}))}
                onBlur={()=>saveCount(sp.id)}/>
            </div>
          );
        })}

        <Btn v={zc.ok?'success':'ghost'} onClick={finalize} disabled={!zc.ok} loading={saving} style={{marginTop:8}}>
          {zc.ok?'精算へ進む →':'±0 を確認してから精算へ'}
        </Btn>
      </div>
    </>
  );
};

// ─── SETTLEMENT ───────────────────────────────────────────────

const Settlement = ({session, isAdmin, onBack}) => {
  const [sps,setSps] = useState([]);
  const [txs,setTxs] = useState([]);
  const [transfers,setTransfers] = useState([]);
  const [paid,setPaid] = useState(new Set());
  const [loading,setLoading] = useState(true);
  const [closing,setClosing] = useState(false);
  const [closed,setClosed] = useState(session.status==='closed');

  const load = async () => {
    const [{data:s},{data:t},{data:st}] = await Promise.all([
      db.from('session_players').select().eq('session_id',session.id).eq('status','active').order('joined_at'),
      db.from('transactions').select().eq('session_id',session.id).eq('status','approved').order('created_at'),
      db.from('settlement_transfers').select().eq('session_id',session.id)
    ]);
    if (!s||!t) return;
    const withStats = s.map(sp=>({...sp,...calcStats(sp,t,session.chip_rate),_total:calcStats(sp,t,session.chip_rate).total??0}));
    setSps(withStats); setTxs(t);

    if (st&&st.length>0) {
      const trs = st.map(x=>{
        const fr=s.find(p=>p.id===x.from_session_player_id);
        const to=s.find(p=>p.id===x.to_session_player_id);
        return {id:x.id,from:fr?.display_name,to:to?.display_name,fromId:x.from_session_player_id,toId:x.to_session_player_id,amount:x.amount,is_paid:x.is_paid};
      });
      setTransfers(trs);
      setPaid(new Set(st.filter(x=>x.is_paid).map(x=>x.id)));
    } else if (isAdmin) {
      // Calculate and save
      const xfers = minimize(withStats);
      if (xfers.length>0) {
        const {data:saved} = await db.from('settlement_transfers').insert(
          xfers.map(x=>({session_id:session.id,from_session_player_id:x.fromId,to_session_player_id:x.toId,amount:x.amount,is_paid:false}))
        ).select();
        if (saved) {
          const trs = saved.map((x,i)=>({id:x.id,...xfers[i],is_paid:false}));
          setTransfers(trs);
        }
      } else { setTransfers([]); }
    }
    setLoading(false);
  };

  useEffect(()=>{load();},[]);

  useEffect(()=>{
    const ch = db.channel('settle_'+session.id)
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'settlement_transfers',filter:`session_id=eq.${session.id}`},()=>load())
      .subscribe();
    return ()=>db.removeChannel(ch);
  },[]);

  const markPaid = async (tr) => {
    await db.from('settlement_transfers').update({is_paid:true}).eq('id',tr.id);
    setPaid(s=>{const n=new Set(s);n.add(tr.id);return n;});
  };

  const closeSession = async () => {
    setClosing(true);
    // Calculate unpaid carry-overs
    const unpaid = transfers.filter(t=>!paid.has(t.id));
    const net = {};
    for (const t of unpaid) {
      net[t.fromId]=(net[t.fromId]||0)-t.amount;
      net[t.toId]=(net[t.toId]||0)+t.amount;
    }
    // Update player carry_over
    for (const [spId,delta] of Object.entries(net)) {
      const sp = sps.find(p=>p.id===spId);
      if (!sp?.player_id) continue;
      const {data:pl} = await db.from('players').select('carry_over_balance').eq('id',sp.player_id).single();
      if (pl) await db.from('players').update({carry_over_balance:(pl.carry_over_balance||0)+delta}).eq('id',sp.player_id);
    }
    await db.from('sessions').update({status:'closed',closed_at:new Date().toISOString()}).eq('id',session.id);
    setClosing(false); setClosed(true);
  };

  if(loading) return <Loading/>;
  const allPaid = transfers.length===0||transfers.every(t=>paid.has(t.id));

  return (
    <>
      <div className="hdr">
        {onBack && <Back onClick={onBack}/>}
        <span className="hdr-title">精算{closed?' (完了)':''}</span>
        {isAdmin && <span className="bdg bdg-admin">管理者</span>}
      </div>
      <div className="page" style={{paddingTop:16}}>
        <div className="sec-lbl">収支結果</div>
        {sps.map(sp=>(
          <div key={sp.id} className="card mb" style={{marginBottom:10}}>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <Av name={sp.display_name}/>
              <div style={{flex:1}}>
                <div style={{fontWeight:600,fontSize:15}}>{sp.display_name}</div>
                {sp.carryOver!==0 && (
                  <div style={{fontSize:11,color:'var(--muted)',marginTop:2}}>
                    今回{fy(sp.profitYen)} + 繰越{fy(sp.carryOver)}
                  </div>
                )}
              </div>
              <AmtTag yen={sp.total}/>
            </div>
            <div className="divider"/>
            <div style={{display:'flex',justifyContent:'space-around',fontSize:11,color:'var(--muted)'}}>
              <span>バイイン {sp.buyIn}枚</span>
              <span>ネット借入 {sp.netBorrow}枚</span>
              <span>最終 {sp.final_chip_count}枚</span>
              <span style={{color:sp.profitChips>=0?'var(--green)':'var(--red)',fontWeight:600}}>{fc(sp.profitChips)}</span>
            </div>
          </div>
        ))}

        <div className="sec-lbl">支払いリスト</div>
        {transfers.length===0 ? (
          <div className="ok">全員の収支がゼロ — 精算不要 🎉</div>
        ) : transfers.map((tr,i)=>{
          const isPaid = paid.has(tr.id);
          return (
            <div key={i} className="card mb" style={{marginBottom:8,opacity:isPaid?.6:1}}>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:14}}>
                    <span style={{fontWeight:700,color:'var(--red)'}}>{tr.from}</span>
                    <span style={{color:'var(--muted)',margin:'0 6px'}}>→</span>
                    <span style={{fontWeight:700,color:'var(--green)'}}>{tr.to}</span>
                  </div>
                  <div style={{fontSize:22,fontWeight:700,fontFamily:'Outfit,sans-serif',marginTop:2}}>
                    ¥{tr.amount.toLocaleString()}
                  </div>
                </div>
                {isPaid ? (
                  <span className="bdg bdg-active">支払済</span>
                ) : (
                  <Btn sm v="success" full={false} onClick={()=>markPaid(tr)}>支払完了</Btn>
                )}
              </div>
            </div>
          );
        })}

        {isAdmin && !closed && (
          <div style={{marginTop:16}}>
            {allPaid && <div className="ok" style={{marginBottom:10}}>全額精算完了！</div>}
            <Btn v={allPaid?'primary':'outline'} onClick={closeSession} loading={closing}>
              {allPaid?'セッションを閉じる':'一部未払いのまま閉じる（未払い分は繰越）'}
            </Btn>
          </div>
        )}
        {closed && <div className="ok" style={{marginTop:12}}>このセッションは精算完了しました</div>}
      </div>
    </>
  );
};

    const tok = p.get('a');

    if (!sid) { nav('home'); return; }

    db.from('sessions').select().eq('id',sid).single().then(({data,error})=>{
      if (error||!data) { showToast('セッションが見つかりません','err'); nav('home'); return; }
      setSess(data);

      // Admin check
      const savedAdmin = localStorage.getItem(`pk_admin_${sid}`);
      const adminTok = tok || savedAdmin;

      if (adminTok && data.admin_token===adminTok) {
        setAdmin(true);
        localStorage.setItem(`pk_admin_${sid}`,adminTok);
        if (data.status==='settling'||data.status==='closed') nav('settlement');
        else if (data.status==='counting') nav('counting');
        else nav('admin');
        return;
      }

      // Player check
      const savedSp = localStorage.getItem(`pk_sp_${sid}`);
      if (savedSp) {
        db.from('session_players').select().eq('id',savedSp).single().then(({data:sp})=>{
          if (sp) {
            setSpId(savedSp);
            if (data.status==='settling'||data.status==='closed') nav('settlement');
            else if (sp.status==='active') nav('player');
            else nav('join');
          } else { nav('join'); }
        });
      } else { nav('join'); }
    });
  },[]);

  const handleCreated = (sess, token) => {
    setCreated({session:sess,token});
    setSess(sess); setAdmin(true);
    localStorage.setItem(`pk_admin_${sess.id}`,token);
    window.history.pushState({}, '', '?s=' + sess.id + '&a=' + token);
    nav('created');
  };

  const handleGoAdmin = () => {
    window.history.pushState({}, '', '?s=' + created.session.id + '&a=' + created.token);
    nav('admin');
  };

  const handleJoinByCode = (code) => {
    window.history.pushState({}, '', '?s=' + code);
    db.from('sessions').select().eq('id',code).single().then(({data,error})=>{
      if (error||!data) { showToast('セッションが見つかりません','err'); return; }
      setSess(data); nav('join');
    });
  };

  const handleJoined = (spId, name) => { setSpId(spId); nav('player'); };

  const R = () => {
    switch(view) {
      case 'loading': return <div className="center"><Spin size={36}/></div>;
      case 'home':    return <Home onCreate={()=>nav('create')} onJoin={handleJoinByCode} onUnsettled={()=>nav('unsettled')} onSessions={()=>nav('sessions')} onStats={()=>nav('stats')}/>;
      case 'create':  return <CreateSession onBack={()=>nav('home')} onCreated={handleCreated}/>;
      case 'created': return created ? <Created session={created.session} adminToken={created.token} onAdmin={handleGoAdmin}/> : null;
      case 'join':    return session ? <JoinSession session={session} onBack={()=>nav('home')} onJoined={handleJoined}/> : null;
      case 'admin':   return session ? <AdminView session={session} onCounting={()=>nav('counting')}/> : null;
      case 'player':  return session&&mySpId ? <PlayerView session={session} mySpId={mySpId} onEnd={s=>{if(s==='settling')nav('settlement')}}/> : null;
      case 'counting':return session ? <Counting session={session} onComplete={()=>nav('settlement')}/> : null;
      case 'settlement': return session ? <Settlement session={session} isAdmin={isAdmin} onBack={isAdmin?null:()=>nav('sessions')}/> : null;
      case 'unsettled': return <Unsettled onBack={()=>nav('home')}/>;
      case 'sessions':  return <SessionsList onBack={()=>nav('home')} onSelect={handleJoinByCode} onViewResult={(s)=>{setSess(s);nav('settlement')}}/>;
      case 'stats':     return <StatsPage onBack={()=>nav('home')}/>;
      default: return <Home onCreate={()=>nav('create')} onJoin={handleJoinByCode} onUnsettled={()=>nav('unsettled')}/>;
    }
  };

  return (
    <div style={{maxWidth:430,margin:'0 auto',minHeight:'100dvh',background:'var(--bg)',fontFamily:"'Noto Sans JP','Outfit',sans-serif",color:'var(--text)'}}>
      <R/>
      {toast && <Toast msg={toast.msg} type={toast.type}/>}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
